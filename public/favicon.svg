<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#141E33"/>
      <stop offset="50%" stop-color="#0B1220"/>
      <stop offset="85%" stop-color="#060911"/>
      <stop offset="100%" stop-color="#030508"/>
    </radialGradient>

    <!-- Outer Gold Ring Gradient -->
    <linearGradient id="gold-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="25%" stop-color="#FFB800"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#FF9100"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>

    <!-- Cyan Electric Edge -->
    <linearGradient id="cyan-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Core Wing Primary Gradient -->
    <linearGradient id="wing-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="30%" stop-color="#FFC107"/>
      <stop offset="70%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Core Wing Secondary Gradient -->
    <linearGradient id="wing-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="80%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Glass Specular Highlight -->
    <linearGradient id="specular-highlight" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="core-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Master Base Disc -->
  <circle cx="256" cy="256" r="248" fill="url(#bg-grad)"/>

  <!-- 2. Dual Concentric Orbit Rings (Web3 Precision) -->
  <circle cx="256" cy="256" r="244" fill="none" stroke="url(#gold-ring)" stroke-width="5" stroke-opacity="0.85"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="14 8" stroke-opacity="0.6"/>
  <circle cx="256" cy="256" r="218" fill="none" stroke="#FFB800" stroke-width="1" stroke-opacity="0.35"/>

  <!-- 3. Four Cardinal Nodes -->
  <circle cx="256" cy="12" r="4.5" fill="#FFE082"/>
  <circle cx="500" cy="256" r="4.5" fill="#00F2FE"/>
  <circle cx="256" cy="500" r="4.5" fill="#FFE082"/>
  <circle cx="12" cy="256" r="4.5" fill="#00F2FE"/>

  <!-- 4. Subtle Outer Horizon Nodes -->
  <circle cx="83" cy="83" r="2.5" fill="#38BDF8" opacity="0.6"/>
  <circle cx="429" cy="83" r="2.5" fill="#FFB800" opacity="0.6"/>
  <circle cx="429" cy="429" r="2.5" fill="#38BDF8" opacity="0.6"/>
  <circle cx="83" cy="429" r="2.5" fill="#FFB800" opacity="0.6"/>

  <!-- 5. Glassmorphism Top Dome Arc -->
  <path d="M 28 256 A 228 228 0 0 1 484 256 A 228 170 0 0 0 28 256 Z" fill="url(#specular-highlight)"/>

  <!-- 6. Inner Geometric Shield / Hex-Ring -->
  <polygon points="256,68 412,158 412,338 256,428 100,338 100,158" 
           fill="#0A1324" fill-opacity="0.65"
           stroke="url(#gold-ring)" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- 7. FLYX Stylized Emblem Icon (Bold, high-contrast, perfectly visible at 16px & 32px) -->
  <g filter="url(#core-glow)">
    <!-- Top-Left & Upper Diagonal Wing ("F" / Top Apex) -->
    <path d="M 256 108 L 368 172 L 340 188 L 256 140 L 172 188 L 144 172 Z" fill="url(#wing-gold)"/>

    <!-- Left Wing (FLYX Dynamic Chevron Upper) -->
    <path d="M 144 186 L 232 236 L 204 252 L 144 218 L 144 186 Z" fill="url(#wing-gold)"/>

    <!-- Right Wing (FLYX Dynamic Chevron Upper) -->
    <path d="M 368 186 L 368 218 L 308 252 L 280 236 L 368 186 Z" fill="url(#wing-cyan)"/>

    <!-- Central Diamond / Insight Crystal Core -->
    <polygon points="256,214 298,256 256,298 214,256" fill="url(#gold-ring)"/>
    <polygon points="256,226 286,256 256,286 226,256" fill="#0B1329"/>
    <!-- Radiant Aperture Center Dot -->
    <circle cx="256" cy="256" r="10" fill="#00F2FE"/>
    <circle cx="256" cy="256" r="4.5" fill="#FFFFFF"/>

    <!-- Left Lower Anchor Blade ("X" Leg Left) -->
    <path d="M 144 326 L 144 294 L 224 268 L 244 286 L 180 346 Z" fill="url(#wing-cyan)"/>

    <!-- Right Lower Anchor Blade ("X" Leg Right) -->
    <path d="M 368 326 L 332 346 L 268 286 L 288 268 L 368 294 Z" fill="url(#wing-gold)"/>

    <!-- Bottom Apex Chevron -->
    <path d="M 256 404 L 172 356 L 194 340 L 256 374 L 318 340 L 340 356 Z" fill="url(#wing-cyan)"/>
  </g>

  <!-- 8. Edge Glint Stars -->
  <polygon points="256,58 259,68 269,68 261,74 264,84 256,78 248,84 251,74 243,68 253,68" fill="#FFFFFF" opacity="0.9"/>
  <polygon points="412,158 414,164 420,164 415,168 417,174 412,170 407,174 409,168 404,164 410,164" fill="#00F2FE" opacity="0.85"/>
</svg>
