    <!-- Web3 Browser Extension Safe Guard (suppresses external evmAsk.js duplicate window.ethereum definition collision) -->
    <script>
      (function () {
        window.addEventListener(
          'error',
          function (e) {
            if (
              e &&
              e.message &&
              (e.message.indexOf('Cannot redefine property: ethereum') !== -1 ||
                e.message.indexOf('evmAsk') !== -1)
            ) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return true;
            }
          },
          true
        );
      })();
    </script>
